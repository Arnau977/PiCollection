name: Release

# A tag push builds and publishes a GitHub Release for that version as a
# pre-release by default (plain X.Y.Z versioning, no hyphen suffix ever).
# Promotion to stable ("Latest") is a manual step done after verification:
# gh release edit vX.Y.Z --prerelease=false --latest - see docs/auto-update.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Runs once, before the OS build matrix, so all three builds upload their
  # assets into a single release that already has a proper title and
  # changelog - left as electron-builder's default (an empty "Release vX.Y.Z"
  # body), the matrix would still produce one release, just with no useful
  # description of what changed.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "PiCollection ${{ github.ref_name }}" \
            --generate-notes \
            --draft \
            --prerelease

      - name: Prepend a Highlights placeholder for manual review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json body -q .body)
          { printf '## Highlights\n\n_Fill in 2-3 bullet points of user-facing changes before publishing._\n\n'; echo "$NOTES"; } > notes.md
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes-file notes.md

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
