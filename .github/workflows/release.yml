name: Release

# A tag push builds and publishes a GitHub Release for that version. A plain
# tag (v1.2.0) publishes to the stable channel; a prerelease tag
# (v1.2.0-beta.1) is published as a GitHub prerelease and picked up only by
# clients on the beta channel - see docs/auto-update.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Runs once, before the OS build matrix, so all three builds upload their
  # assets into a single release that already has a proper title and
  # changelog - left as electron-builder's default (an empty "Release vX.Y.Z"
  # body), the matrix would still produce one release, just with no useful
  # description of what changed.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Determine prerelease flag from the tag
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "PiCollection ${{ github.ref_name }}" \
            --generate-notes \
            --draft \
            --prerelease=${{ steps.prerelease.outputs.value }}

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
