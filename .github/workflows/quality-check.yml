name: Quality Check

on:
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Not `npm run lint`: that script passes --fix, which would silently
        # rewrite files instead of failing the check on lint issues.
        run: npx eslint . --ext .js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the project
        run: npm run build
