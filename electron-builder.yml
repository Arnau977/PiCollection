appId: com.arnau977.picollection
productName: PiCollection
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: PiCollection
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # AppImage only: runs on any distro with no install/package-manager step,
  # and (unlike snap/deb) electron-updater can actually auto-update it - see
  # docs/auto-update.md. snap/deb dropped to cut release noise down to one
  # artifact per major OS (Windows/macOS/Linux).
  target:
    - AppImage
  maintainer: Arnau977
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Arnau977
  repo: PiCollection
  # Versions are always plain X.Y.Z, and every release publishes the same
  # latest*.yml manifest - there is no separate beta manifest. Which channel
  # can see a release is decided by GitHub's own "Pre-release" flag on it
  # (set by release.yml, cleared manually to promote to stable), so both
  # channels read the same repo and no per-channel feed URL is needed.
  # See docs/auto-update.md.
